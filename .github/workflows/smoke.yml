name: AutoAds build and smoke tests

on:
  pull_request:
  push:
    branches: [main, feature/editor-controls]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run smoke tests
        run: npm test
      - name: Validate Cloudflare deployment bundle
        run: npx wrangler deploy --dry-run
